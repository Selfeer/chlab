[project]
name = "chlab"
version = "0.1.0"
description = "Run any ClickHouse build, immediately."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
chlab = "chlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chlab*"]

[tool.setuptools.package-data]
chlab = ["web/templates/*.html", "web/static/**/*", "toolbox/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are reported by the formatter, not the linter
    "SIM105",  # contextlib.suppress is not clearer than a two-line try/except here
    "B008",    # Typer's whole API is function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
